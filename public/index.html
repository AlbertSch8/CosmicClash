<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Clash - Přihlášení</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
              radial-gradient(circle at top, #18244a 0%, #0b1020 45%, #050814 100%);
      color: white;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .star-dot {
      position: absolute;
      border-radius: 50%;
      background: white;
      opacity: 0.8;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--min, 0.2); transform: scale(1); }
      50% { opacity: var(--max, 1); transform: scale(1.4); }
    }

    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      background: rgba(14, 22, 45, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.18);
      backdrop-filter: blur(10px);
      padding: 28px;
    }

    .title {
      text-align: center;
      margin-bottom: 8px;
      color: #6ee7ff;
      font-size: 30px;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(110, 231, 255, 0.35);
    }

    .subtitle {
      text-align: center;
      color: #b8c7ff;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
      background: rgba(255,255,255,0.06);
      color: #d9e3ff;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      color: white;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.35);
    }

    .form-panel {
      display: none;
    }

    .form-panel.active {
      display: block;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #c7d2fe;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: white;
      outline: none;
      font-size: 15px;
    }

    .field input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .field input:focus {
      border-color: rgba(110, 231, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(110, 231, 255, 0.08);
    }

    .btn-main {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      transition: 0.2s ease;
    }

    .btn-main:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .btn-main:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      min-height: 18px;
    }

    .status.error {
      background: rgba(255, 77, 109, 0.12);
      border: 1px solid rgba(255, 77, 109, 0.3);
      color: #ff9fb0;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #9df0b3;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hint {
      text-align: center;
      color: #93a4d8;
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
<div id="stars"></div>

<div class="auth-card">
  <div class="title">Cosmic Clash</div>
  <div class="subtitle">Přihlas se nebo si vytvoř svého vesmírného bojovníka</div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Přihlášení</button>
    <button class="tab-btn" onclick="switchTab('register')">Registrace</button>
  </div>

  <div id="form-login" class="form-panel active">
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="Zadej email" />
    </div>

    <div class="field">
      <label for="login-password">Heslo</label>
      <input id="login-password" type="password" placeholder="Zadej heslo" />
    </div>

    <button id="btn-login" class="btn-main" onclick="handleLogin()">Přihlásit se</button>
    <div id="login-status" class="status"></div>
  </div>

  <div id="form-register" class="form-panel">
    <div class="field">
      <label for="register-name">Jméno ufouna</label>
      <input id="register-name" type="text" placeholder="Např. Zorblax" />
    </div>

    <div class="field">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" placeholder="Zadej email" />
    </div>

    <div class="field">
      <label for="register-password">Heslo</label>
      <input id="register-password" type="password" placeholder="Minimálně 6 znaků" />
    </div>

    <button id="btn-register" class="btn-main" onclick="handleRegister()">Vytvořit účet</button>
    <div id="register-status" class="status"></div>
  </div>

  <div class="hint">Po registraci se automaticky vytvoří profil hráče.</div>
</div>

<script type="module" src="/src/auth.js"></script>
</body>
</html>
