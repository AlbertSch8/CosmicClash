<!DOCTYPE html>
<!--
  UFO: Cosmic Clash — Dashboard
  Autor: Alexandre Basseville
  Krok 2: Herní profil, energie s obnovou, UI rozcestník, příprava na vybavení
-->
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Clash — Dashboard</title>
  <meta name="description" content="Cosmic Clash - Epická vesmírná bojová hra. Trénuj svého mimozemšťana a staň se legendou arény.">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:    #03020a;
      --deep:    #090618;
      --nebula:  #1a0a2e;
      --accent:  #7b2fff;
      --glow:    #a855f7;
      --cyan:    #06b6d4;
      --star:    #e8d5ff;
      --danger:  #ff3b6e;
      --success: #00e5a0;
      --gold:    #facc15;
      --text:    #c4b5d4;
      --card-bg: rgba(15, 8, 30, 0.88);
      --section-bg: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
    }

    body {
      background: var(--void);
      min-height: 100vh;
      font-family: 'Syne', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Pozadí ── */
    .space-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, #03020a 60%),
        radial-gradient(ellipse at 80% 20%, #0d0527 0%, transparent 50%);
    }
    .nebula-blob {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.2;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .nebula-blob:nth-child(1) { width:500px;height:400px;top:-10%;left:-5%;background:#5b21b6;animation-delay:0s; }
    .nebula-blob:nth-child(2) { width:350px;height:300px;bottom:-5%;right:5%;background:#2563eb;animation-delay:-5s; }
    .nebula-blob:nth-child(3) { width:250px;height:250px;top:30%;right:20%;background:#7c3aed;animation-delay:-10s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,-20px) scale(1.05); }
    }

    /* ── Layout ── */
    .app-wrapper {
      position: relative; z-index: 1;
      max-width: 560px; margin: 0 auto;
      padding: 24px 16px 60px;
    }

    /* ── Hlavička ── */
    .dash-header {
      text-align: center; margin-bottom: 28px;
    }
    /* UFO logo image replacing emoji */
    .dash-logo-img {
      width: 72px; height: 72px;
      object-fit: contain; display: block;
      margin: 0 auto 10px;
      filter: drop-shadow(0 0 16px rgba(123,47,255,.5));
      animation: glow-pulse 3s ease-in-out infinite;
    }
    .dash-header .logo-icon {
      font-size: 36px; display: block; margin-bottom: 6px;
      animation: glow-pulse 3s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%,100% { text-shadow: 0 0 20px #7b2fff; }
      50%      { text-shadow: 0 0 40px #a855f7, 0 0 80px #7b2fff; }
    }
    .dash-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 900; letter-spacing: .15em;
      color: var(--star); text-transform: uppercase;
    }
    .dash-header .subtitle {
      font-size: 12px; letter-spacing: .25em;
      color: var(--glow); opacity: .7;
      text-transform: uppercase; margin-top: 4px;
    }

    /* ── Karta sekce ── */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(123,47,255,.25);
      border-radius: 18px; padding: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 40px rgba(123,47,255,.1);
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--glow); margin-bottom: 14px;
    }

    /* ── Stat řádek ── */
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; margin-bottom: 8px;
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .stat-label { color: var(--glow); font-size: 13px; font-weight: 600; }
    .stat-value { color: var(--star); font-size: 14px; font-weight: 700; }

    /* ── Progress bar ── */
    .bar-block { margin-bottom: 14px; }
    .bar-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-bar {
      width: 100%; height: 12px;
      background: rgba(255,255,255,.07);
      border-radius: 999px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%; border-radius: 999px;
      transition: width .4s ease;
    }
    .xp-fill      { background: linear-gradient(90deg,#8b5cf6,#ec4899); }
    .hp-fill      { background: linear-gradient(90deg,#22c55e,#06b6d4); }
    .stamina-fill { background: linear-gradient(90deg,#f59e0b,#facc15); }

    /* ── Energie ── */
    .energy-dots {
      display: flex; gap: 10px; margin-bottom: 10px;
    }
    .energy-dot {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.05);
      transition: all .35s ease;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .energy-dot.filled {
      background: radial-gradient(circle, #facc15 0%, #f59e0b 100%);
      border-color: #facc15;
      box-shadow: 0 0 12px rgba(250,204,21,.5);
    }
    .energy-timer {
      font-size: 12px; color: var(--text); opacity: .75;
      min-height: 18px;
    }
    .energy-full { font-size: 12px; color: var(--success); }

    /* ── Měna ── */
    .currency-row { display: flex; gap: 12px; }
    .currency-chip {
      flex: 1; padding: 12px;
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 12px; text-align: center;
    }
    .currency-chip .chip-icon  { font-size: 22px; display: block; margin-bottom: 4px; }
    .currency-chip .chip-label { font-size: 10px; letter-spacing: .15em; color: var(--glow); text-transform: uppercase; }
    .currency-chip .chip-value { font-size: 18px; font-weight: 700; color: var(--star); }

    /* ── Navigační tlačítka ── */
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 18px 12px;
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 14px; cursor: pointer;
      color: var(--text); font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 600;
      transition: all .2s ease;
      text-decoration: none;
    }
    .nav-btn:hover {
      border-color: rgba(123,47,255,.5);
      background: rgba(123,47,255,.12);
      color: var(--star);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(123,47,255,.2);
    }
    .nav-btn .nav-icon { font-size: 28px; }
    .nav-btn .nav-badge {
      font-size: 10px; letter-spacing: .1em;
      color: var(--glow); text-transform: uppercase;
      background: rgba(168,85,247,.15);
      border-radius: 999px; padding: 2px 8px;
    }

    /* ── Akční tlačítka ── */
    .btn {
      width: 100%; margin-top: 10px; padding: 13px;
      border: none; border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      cursor: pointer; transition: all .2s ease;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
    .btn-primary {
      background: linear-gradient(135deg, #7b2fff, #4f0fbb);
      color: white;
      box-shadow: 0 4px 20px rgba(123,47,255,.35);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(123,47,255,.5);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ff4d6d, #c2185b);
      color: white;
    }
    .btn-danger:hover:not(:disabled) { transform: translateY(-1px); }

    /* ── Načítání / Chyba ── */
    .loading-wrap { text-align: center; padding: 60px 20px; }
    .spinner {
      display: inline-block; width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; letter-spacing: .2em;
      color: var(--glow); text-transform: uppercase;
    }

    /* ── Navigace — zamčené sekce ── */
    .nav-btn-locked {
      opacity: .55;
      cursor: not-allowed;
    }
    .nav-btn-locked:hover {
      transform: none !important;
      box-shadow: none !important;
      background: var(--section-bg) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }

    /* ── Tréninkové karty (výběr režimu) ── */
    .training-modes {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .training-mode-card {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: border-color .2s, box-shadow .2s;
    }
    .training-mode-card:not(.mode-disabled):hover {
      border-color: rgba(123,47,255,.5);
      box-shadow: 0 0 20px rgba(123,47,255,.12);
    }
    .mode-disabled { opacity: .5; }
    .mode-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .mode-icon { font-size: 32px; }
    .mode-info { flex: 1; }
    .mode-label {
      font-weight: 700;
      color: var(--star);
      font-size: 15px;
      margin-bottom: 3px;
    }
    .mode-cost { font-size: 13px; font-weight: 600; }
    .cost-ok  { color: var(--success); }
    .cost-nok { color: var(--danger); }
    .mode-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .mode-rewards {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .reward-tag {
      font-size: 11px;
      background: rgba(168,85,247,.15);
      border: 1px solid rgba(168,85,247,.3);
      border-radius: 999px;
      padding: 3px 10px;
      color: var(--glow);
    }

    /* ── Aktivní trénink — countdown ── */
    .training-active-card { text-align: center; }
    .countdown-display {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(32px, 10vw, 52px);
      font-weight: 900;
      color: var(--star);
      letter-spacing: .1em;
      text-shadow: 0 0 30px rgba(123,47,255,.6);
      margin: 12px 0 20px;
    }
    .training-progress-wrap { margin-bottom: 6px; }
    .training-fill { background: linear-gradient(90deg, #7b2fff, #06b6d4); }
    .progress-hint {
      font-size: 11px;
      color: var(--text);
      opacity: .6;
      margin-top: 6px;
      text-align: center;
    }

    /* ── Odměna čeká ── */
    .reward-card { text-align: center; }
    .reward-preview {
      font-size: 14px;
      color: var(--gold);
      background: rgba(250,204,21,.08);
      border: 1px solid rgba(250,204,21,.25);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .reward-preview-big {
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      margin-bottom: 14px;
    }
    .reward-hint {
      font-size: 12px;
      color: var(--text);
      opacity: .7;
      margin-bottom: 16px;
    }

    /* ── Sekundární tlačítko ── */
    .btn-secondary {
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,.12);
      color: var(--star);
    }

    /* ══ BOJOVÉ KOMPONENTY ══════════════════════════════════════════════════ */

    .btn-battle {
      width: 100%; margin-top: 10px; padding: 14px;
      border: none; border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; cursor: pointer; transition: all .2s ease;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white; box-shadow: 0 4px 20px rgba(220,38,38,.35);
    }
    .btn-battle:hover:not(:disabled) {
      transform: translateY(-1px); box-shadow: 0 6px 28px rgba(220,38,38,.5);
    }
    .btn-battle:disabled { opacity: .45; cursor: not-allowed; }

    .battle-block-msg {
      background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.25);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
      color: #fde68a; font-size: 13px; text-align: center;
    }
    .battle-status-msg {
      min-height: 20px; margin-top: 10px;
      font-size: 13px; color: #a5f3fc; text-align: center;
    }
    .empty-opponent {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 24px; color: var(--text); opacity: .6;
    }
    .empty-icon { font-size: 36px; }

    .fighter-attacker .section-title { color: var(--cyan); }
    .fighter-defender .section-title { color: #fca5a5; }
    .fighter-name {
      font-family: 'Orbitron', sans-serif; font-size: 16px;
      font-weight: 700; color: var(--star); margin-bottom: 2px;
    }
    .fighter-origin { font-size: 12px; color: var(--glow); margin-bottom: 12px; }
    .fighter-stats { display: flex; flex-direction: column; gap: 8px; }
    .fstat { display: flex; align-items: center; gap: 8px; }
    .fstat-label {
      min-width: 54px; font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--glow);
    }
    .fstat-bar { flex: 1; height: 8px; }
    .fstat-val { font-size: 13px; font-weight: 700; color: var(--star); min-width: 28px; text-align: right; }
    .fstat-val-only { margin-left: auto; }

    .battle-vs-grid { display: flex; flex-direction: column; gap: 0; }
    .vs-badge {
      text-align: center; font-family: 'Orbitron', sans-serif;
      font-size: 20px; font-weight: 900; color: var(--gold);
      text-shadow: 0 0 20px rgba(250,204,21,.5); padding: 4px 0;
    }

    .comparison-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .cmp-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 8px;
      background: var(--section-bg); border: 1px solid var(--border);
    }
    .cmp-label {
      flex: 1; text-align: center; font-size: 12px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--text);
    }
    .cmp-val { min-width: 40px; font-size: 15px; font-weight: 700; color: var(--star); }
    .cmp-val:first-child { text-align: left; }
    .cmp-val:last-child  { text-align: right; }
    .cmp-win  { color: var(--success); }
    .cmp-loss { color: #fca5a5; }
    .cmp-hint { font-size: 11px; color: var(--text); opacity: .6; text-align: center; }

    .result-card { text-align: center; }
    .result-win  { border-color: rgba(0,229,160,.3); box-shadow: 0 0 30px rgba(0,229,160,.08); }
    .result-loss { border-color: rgba(255,59,110,.3); box-shadow: 0 0 30px rgba(255,59,110,.08); }
    .score-row {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin: 16px 0;
    }
    .score-side { flex: 1; }
    .score-name  { font-size: 12px; color: var(--glow); margin-bottom: 4px; }
    .score-value {
      font-family: 'Orbitron', sans-serif; font-size: 32px;
      font-weight: 900; color: var(--star);
    }
    .score-label { font-size: 10px; color: var(--text); opacity: .7; margin-top: 2px; }
    .score-vs    { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--gold); }
    .result-rewards {
      background: var(--section-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; margin-top: 12px;
    }
    .rewards-title { font-size: 12px; font-weight: 700; color: var(--glow); margin-bottom: 6px; }
    .rewards-text  { font-size: 14px; font-weight: 700; color: var(--gold); }

    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .battle-history-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px; border-radius: 12px;
      background: var(--section-bg); border: 1px solid var(--border);
    }
    .history-win  { border-left: 3px solid var(--success); }
    .history-loss { border-left: 3px solid var(--danger); }
    .history-icon { font-size: 22px; padding-top: 2px; }
    .history-info { flex: 1; }
    .history-opponent { font-weight: 700; color: var(--star); font-size: 14px; margin-bottom: 3px; }
    .history-meta     { font-size: 12px; color: var(--text); opacity: .7; margin-bottom: 3px; }
    .history-rewards  { font-size: 12px; color: var(--gold); }
    .history-date     { font-size: 11px; color: var(--text); opacity: .5; white-space: nowrap; padding-top: 2px; }
    .empty-history {
      padding: 24px; text-align: center; color: var(--text); opacity: .6; font-size: 14px;
    }

    /* ══ LEADERBOARD ════════════════════════════════════════════════════════ */

    .lb-card { padding-bottom: 8px; }
    .lb-list { display: flex; flex-direction: column; gap: 8px; }

    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border-radius: 12px;
      background: var(--section-bg); border: 1px solid var(--border);
      transition: border-color .2s;
    }
    .lb-row-me {
      border-color: rgba(6,182,212,.45);
      box-shadow: 0 0 16px rgba(6,182,212,.08);
    }
    .lb-row-top3 { background: rgba(255,255,255,.06); }

    /* Rank / medaile */
    .lb-rank { min-width: 36px; text-align: center; }
    .lb-medal  { font-size: 22px; }
    .lb-number {
      font-family: 'Orbitron', sans-serif; font-size: 13px;
      font-weight: 700; color: var(--text); opacity: .6;
    }

    /* Hlavní info */
    .lb-main { flex: 1; min-width: 0; }
    .lb-name {
      font-weight: 700; color: var(--star); font-size: 14px;
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lb-you-badge {
      font-size: 10px; background: rgba(6,182,212,.2);
      border: 1px solid rgba(6,182,212,.4); border-radius: 999px;
      padding: 1px 7px; color: var(--cyan); font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .lb-origin { font-size: 11px; color: var(--glow); margin-bottom: 6px; }

    /* XP bar */
    .lb-xp-wrap { display: flex; align-items: center; gap: 8px; }
    .lb-xp-bar {
      flex: 1; height: 5px; border-radius: 999px;
      background: rgba(255,255,255,.07); overflow: hidden;
    }
    .lb-xp-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      transition: width .4s ease;
    }
    .lb-xp-text { font-size: 10px; color: var(--text); opacity: .6; white-space: nowrap; }

    /* Statistiky */
    .lb-stats { text-align: right; }
    .lb-level {
      font-family: 'Orbitron', sans-serif; font-size: 15px;
      font-weight: 900; color: var(--gold);
    }
    .lb-sub-stats {
      display: flex; gap: 8px; justify-content: flex-end;
      font-size: 11px; color: var(--text); opacity: .7; margin-top: 3px;
    }

    .lb-outside-note {
      font-size: 12px; color: var(--text); opacity: .6;
      text-align: center; padding: 14px 8px 6px;
    }
    .lb-empty {
      padding: 24px; text-align: center;
      color: var(--text); opacity: .6; font-size: 14px;
    }

    /* ══ EQUIPMENT / DASHBOARD DOPLŇKY ══════════════════════════════════════ */

    /* Badge pro equipment bonus (+X) vedle statistiky */
    .bonus-tag {
      display: inline-block; margin-left: 6px;
      font-size: 11px; font-weight: 700;
      color: var(--success); background: rgba(0,229,160,.12);
      border: 1px solid rgba(0,229,160,.3); border-radius: 999px;
      padding: 1px 7px; vertical-align: middle;
    }
    .equip-active { color: var(--success); }
    .equip-none   { color: var(--text); opacity: .45; }
    .equip-hint   { font-size: 11px; color: var(--text); opacity: .5; margin-top: 8px; text-align: center; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(123,47,255,.4); border-radius: 3px; }

    /* ── Ikonové obrázky v navigaci a měně ── */
    .nav-img {
      width: 34px; height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(168,85,247,.35));
      transition: filter .2s ease, transform .2s ease;
    }
    .nav-btn:hover .nav-img {
      filter: drop-shadow(0 0 10px rgba(168,85,247,.65));
      transform: scale(1.08);
    }
    .chip-img {
      width: 28px; height: 28px;
      object-fit: contain;
      display: block; margin: 0 auto 4px;
    }

    /* ── Settings tlačítko ── */
    .btn-settings-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 80px; min-height: 64px; border-radius: 12px; flex-shrink: 0;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      cursor: pointer; color: var(--text); font-family: 'Syne', sans-serif;
      transition: background .2s, border-color .2s, transform .15s;
      padding: 8px 6px;
    }
    .btn-settings-btn:hover {
      background: rgba(123,47,255,.15); border-color: rgba(123,47,255,.4);
      transform: translateY(-1px);
    }
    .btn-settings-btn img { transition: opacity .2s; }
    .btn-settings-btn:hover img { opacity: 1 !important; }

    /* ── Admin patička ── */
    .admin-footer {
      text-align: center; padding: 12px 0 4px;
    }
    .admin-footer-link {
      font-size: 11px; color: var(--text); opacity: .3;
      text-decoration: none; letter-spacing: .1em;
      transition: opacity .2s;
    }
    .admin-footer-link:hover { opacity: .7; }

    @media (max-width: 400px) {
      .nav-grid { grid-template-columns: 1fr; }
      .currency-row { flex-direction: column; }
      .lb-sub-stats { gap: 5px; }
    }
  </style>
