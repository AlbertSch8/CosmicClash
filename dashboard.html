<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Clash - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0b1020, #111933, #1a254d);
      color: white;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .space-bg {
      position: absolute;
      inset: 0;
      background:
              radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18) 1px, transparent 2px),
              radial-gradient(circle at 80% 70%, rgba(255,255,255,0.15) 1px, transparent 2px),
              radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12) 1px, transparent 2px);
      background-size: 220px 220px;
      animation: starsMove 28s linear infinite;
      opacity: 0.7;
      z-index: 0;
    }

    @keyframes starsMove {
      from { transform: translateY(0); }
      to { transform: translateY(220px); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 500px;
      background: rgba(17, 25, 51, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0, 200, 255, 0.15);
      backdrop-filter: blur(8px);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #6ee7ff;
      text-shadow: 0 0 10px rgba(110, 231, 255, 0.35);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .stat-label {
      color: #b8c7ff;
      font-weight: bold;
    }

    .stat-value {
      color: #ffffff;
    }

    .btn-logout {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff4d6d, #ff7b54);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-logout:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    #loading {
      text-align: center;
      color: #d6ddff;
      font-size: 18px;
    }
    .btn-action {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-action:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-action:disabled,
    .btn-logout:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .bar-block {
      margin-bottom: 16px;
    }

    .bar-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .xp-fill {
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
    }

    .stamina-fill {
      background: linear-gradient(90deg, #22c55e, #06b6d4);
    }
    .dashboard-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .subtitle {
      color: #b8c7ff;
      font-size: 14px;
      margin-top: 6px;
    }

    .section {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 18px;
      color: #6ee7ff;
      margin-bottom: 14px;
    }

    .action-message {
      margin: 16px 0;
      text-align: center;
      color: #d6ddff;
      min-height: 24px;
    }
  </style>
</head>
<body>
<div class="space-bg"></div>

<div class="card" id="content">
  <div id="loading">Načítám data pilota…</div>
</div>

<script type="module" src="/src/dashboard.js"></script>
</body>
</html>
