<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CosmicClash — Přihlášení</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void: #03020a;
      --deep: #090618;
      --nebula: #1a0a2e;
      --accent: #7b2fff;
      --glow: #a855f7;
      --star: #e8d5ff;
      --danger: #ff3b6e;
      --success: #00e5a0;
      --text: #c4b5d4;
    }

    body {
      background: var(--void);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    /* === SPACE BACKGROUND === */
    .space-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, #03020a 60%),
                  radial-gradient(ellipse at 80% 20%, #0d0527 0%, transparent 50%);
    }
    .nebula-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .nebula-blob:nth-child(1) { width: 500px; height: 400px; top: -10%; left: -5%; background: #5b21b6; animation-delay: 0s; }
    .nebula-blob:nth-child(2) { width: 350px; height: 300px; bottom: -5%; right: 5%; background: #2563eb; animation-delay: -4s; }
    .nebula-blob:nth-child(3) { width: 250px; height: 250px; top: 30%; right: 20%; background: #7c3aed; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, -20px) scale(1.05); }
    }

    /* Stars */
    .stars { position: fixed; inset: 0; z-index: 1; }
    .star-dot {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: var(--min, 0.1); transform: scale(1); }
      to   { opacity: var(--max, 0.9); transform: scale(1.4); }
    }

    /* === CARD === */
    .card {
      position: relative; z-index: 10;
      width: 420px;
      padding: 48px 44px;
      background: rgba(15, 8, 30, 0.85);
      border: 1px solid rgba(123, 47, 255, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      box-shadow: 0 0 60px rgba(123, 47, 255, 0.15), 0 0 0 1px rgba(255,255,255,0.04);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
      animation: orbit 6s linear infinite;
    }
    @keyframes orbit {
      0%   { text-shadow: 0 0 20px #7b2fff; }
      50%  { text-shadow: 0 0 40px #a855f7, 0 0 80px #7b2fff; }
      100% { text-shadow: 0 0 20px #7b2fff; }
    }
    .logo h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--star);
      text-transform: uppercase;
    }
    .logo p {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--glow);
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .tab-btn {
      flex: 1; padding: 9px; border: none;
      background: transparent; cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(196, 181, 212, 0.5);
      border-radius: 7px;
      transition: all 0.25s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #7b2fff, #5b1cc0);
      color: white;
      box-shadow: 0 2px 16px rgba(123, 47, 255, 0.4);
    }

    /* Form */
    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; animation: fadeUp 0.3s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--glow);
      font-weight: 600;
    }
    input[type="email"], input[type="password"], input[type="text"] {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(123, 47, 255, 0.25);
      border-radius: 9px;
      padding: 13px 16px;
      color: var(--star);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(123, 47, 255, 0.15);
    }
    input::placeholder { color: rgba(196, 181, 212, 0.3); }

    /* Submit button */
    .btn-submit {
      margin-top: 6px;
      padding: 14px;
      background: linear-gradient(135deg, #7b2fff 0%, #4f0fbb 100%);
      border: none; border-radius: 10px;
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 24px rgba(123, 47, 255, 0.4);
      position: relative; overflow: hidden;
    }
    .btn-submit::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(123, 47, 255, 0.55); }
    .btn-submit:hover::after { opacity: 1; }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Status */
    .status {
      font-size: 13px;
      border-radius: 8px;
      padding: 11px 14px;
      display: none;
      line-height: 1.4;
    }
    .status.error  { display: block; background: rgba(255, 59, 110, 0.1); border: 1px solid rgba(255,59,110,0.3); color: #ff6b8a; }
    .status.success{ display: block; background: rgba(0, 229, 160, 0.08); border: 1px solid rgba(0,229,160,0.25); color: var(--success); }

    /* Spinner */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="space-bg">
  <div class="nebula-blob"></div>
  <div class="nebula-blob"></div>
  <div class="nebula-blob"></div>
</div>
<div class="stars" id="stars"></div>

<div class="card">
  <div class="logo">
    <span class="logo-icon">🪐</span>
    <h1>CosmicClash</h1>
    <p>Interstellar Battle Arena</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Přihlásit se</button>
    <button class="tab-btn" onclick="switchTab('register')">Registrace</button>
  </div>

  <!-- Login form -->
  <div class="form active" id="form-login">
    <div class="status" id="login-status"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="pilot@galaxy.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Heslo</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-submit" id="btn-login" onclick="handleLogin()">
      Vstoupit do arény
    </button>
  </div>

  <!-- Register form -->
  <div class="form" id="form-register">
    <div class="status" id="register-status"></div>
    <div class="field">
      <label>Jméno pilota</label>
      <input type="text" id="register-name" placeholder="StarLord42" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="register-email" placeholder="pilot@galaxy.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Heslo</label>
      <input type="password" id="register-password" placeholder="min. 6 znaků" autocomplete="new-password"/>
    </div>
    <button class="btn-submit" id="btn-register" onclick="handleRegister()">
      Zahájit misi
    </button>
  </div>
</div>

<!-- Firebase (compat SDK via Firebase Hosting) -->
<script src="/__/firebase/12.10.0/firebase-app-compat.js"></script>
<script src="/__/firebase/12.10.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/12.10.0/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
  // ── Stars ──────────────────────────────────────────────
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star-dot';
    const size = Math.random() * 2.2 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --d:${(Math.random()*4+2).toFixed(1)}s;
      --min:${(Math.random()*0.2+0.05).toFixed(2)};
      --max:${(Math.random()*0.6+0.3).toFixed(2)};
      animation-delay:-${(Math.random()*6).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // ── Tab switching ──────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) =>
      b.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1))
    );
    document.getElementById('form-login').classList.toggle('active', tab==='login');
    document.getElementById('form-register').classList.toggle('active', tab==='register');
    clearStatuses();
  }

  function clearStatuses() {
    ['login-status','register-status'].forEach(id => {
      const el = document.getElementById(id);
      el.className = 'status'; el.innerHTML = '';
    });
  }

  function showStatus(id, type, msg) {
    const el = document.getElementById(id);
    el.className = 'status ' + type;
    el.innerHTML = msg;
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    if (loading) {
      btn.dataset.orig = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span> Zpracovávám...';
    } else {
      btn.innerHTML = btn.dataset.orig || btn.textContent;
    }
  }

  // ── Firebase Error messages ────────────────────────────
  const errorMsg = {
    'auth/user-not-found':       'Účet s tímto emailem neexistuje.',
    'auth/wrong-password':       'Nesprávné heslo.',
    'auth/invalid-email':        'Neplatný formát emailu.',
    'auth/email-already-in-use': 'Tento email je již používán.',
    'auth/weak-password':        'Heslo musí mít alespoň 6 znaků.',
    'auth/too-many-requests':    'Příliš mnoho pokusů. Zkus to za chvíli.',
    'auth/invalid-credential':   'Nesprávný email nebo heslo.',
  };
  const friendlyError = code => errorMsg[code] || 'Nastala chyba. Zkus to znovu.';

  // ── Login ──────────────────────────────────────────────
  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    clearStatuses();
    if (!email || !pass) { showStatus('login-status','error','Vyplň email a heslo.'); return; }

    setLoading('btn-login', true);
    try {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
      showStatus('login-status','success','✓ Přihlášení úspěšné! Přesměrovávám...');
      setTimeout(() => window.location.href = '/dashboard.html', 800);
    } catch (e) {
      showStatus('login-status','error', friendlyError(e.code));
      setLoading('btn-login', false);
    }
  }

  // ── Register ───────────────────────────────────────────
  async function handleRegister() {
    const name  = document.getElementById('register-name').value.trim();
    const email = document.getElementById('register-email').value.trim();
    const pass  = document.getElementById('register-password').value;
    clearStatuses();
    if (!name || !email || !pass) { showStatus('register-status','error','Vyplň všechna pole.'); return; }

    setLoading('btn-register', true);
    try {
      const cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
      const uid  = cred.user.uid;

      // Vytvoř profil ufonka ve Firestore
      await firebase.firestore().doc(`aliens/${uid}`).set({
        name,
        email,
        level:     1,
        xp:        0,
        hp:        100,
        dmg:       10,
        stamina:   10,
        starCoins: 50,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      showStatus('register-status','success','✓ Účet vytvořen! Přesměrovávám...');
      setTimeout(() => window.location.href = '/dashboard.html', 800);
    } catch (e) {
      showStatus('register-status','error', friendlyError(e.code));
      setLoading('btn-register', false);
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('form-login').classList.contains('active')) handleLogin();
    else handleRegister();
  });

  // Redirect if already logged in
  firebase.auth().onAuthStateChanged(user => {
    if (user) window.location.href = '/dashboard.html';
  });
</script>
</body>
</html>
