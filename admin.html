<!DOCTYPE html>
<!--
  UFO: Cosmic Clash — Admin "God Mode" Terminal
  Autor: Alexandre Basseville
-->
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Clash — God Mode</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════════════
       RESET & TOKENS
    ══════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #050410;
      --surface:   #0b0920;
      --card:      #0f0d24;
      --border:    rgba(123, 47, 255, 0.22);
      --border-hi: rgba(123, 47, 255, 0.55);
      --accent:    #7b2fff;
      --accent2:   #06b6d4;
      --glow:      #a855f7;
      --star:      #e8d5ff;
      --text:      #9b91b8;
      --text-dim:  #5a5270;
      --gold:      #facc15;
      --gold-dim:  rgba(250,204,21,.15);
      --gem:       #22d3ee;
      --gem-dim:   rgba(34,211,238,.12);
      --success:   #00e5a0;
      --danger:    #ff3b6e;
      --mono:      'Share Tech Mono', 'Courier New', monospace;
      --heading:   'Orbitron', sans-serif;
      --body:      'Syne', sans-serif;
    }

    html, body {
      height: 100%; background: var(--bg);
      color: var(--star); font-family: var(--body);
      overflow-x: hidden;
    }

    /* Scanline vrstvy pro efekt CRT monitoru */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.06) 2px,
        rgba(0,0,0,.06) 4px
      );
    }

    /* Amient glow pozadí */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(123,47,255,.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 90%, rgba(6,182,212,.06) 0%, transparent 70%);
    }

    #root { position: relative; z-index: 1; min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(123,47,255,.4); border-radius: 3px; }

    /* ══════════════════════════════════════════════════
       LOGIN SCREEN
    ══════════════════════════════════════════════════ */
    .adm-login-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .adm-login-box {
      width: 100%; max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border-hi);
      border-radius: 16px; padding: 44px 36px;
      box-shadow: 0 0 60px rgba(123,47,255,.15), 0 0 0 1px rgba(255,255,255,.03);
      text-align: center;
    }

    .adm-login-icon {
      font-size: 52px; margin-bottom: 14px;
      filter: drop-shadow(0 0 20px var(--accent));
      animation: spin-slow 8s linear infinite;
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }

    .adm-login-title {
      font-family: var(--heading);
      font-size: 28px; font-weight: 900;
      letter-spacing: .25em; color: var(--star);
      text-shadow: 0 0 30px rgba(123,47,255,.6);
      margin-bottom: 6px;
    }

    .adm-login-sub {
      font-size: 11px; letter-spacing: .25em;
      text-transform: uppercase; color: var(--glow);
      opacity: .7; margin-bottom: 32px;
    }

    .adm-login-field {
      display: flex; align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border-hi);
      border-radius: 10px; overflow: hidden;
      margin-bottom: 10px;
      transition: border-color .2s, box-shadow .2s;
    }
    .adm-login-field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(123,47,255,.15);
    }

    .adm-login-prefix {
      padding: 0 12px; font-family: var(--mono);
      font-size: 12px; color: var(--glow); white-space: nowrap;
      border-right: 1px solid var(--border);
    }

    .adm-login-input {
      flex: 1; background: transparent; border: none; outline: none;
      padding: 14px 16px; color: var(--star);
      font-family: var(--mono); font-size: 16px; letter-spacing: .2em;
    }
    .adm-login-input::placeholder { color: var(--text-dim); letter-spacing: .1em; }

    .adm-login-err {
      min-height: 20px; font-size: 12px;
      color: var(--danger); font-family: var(--mono);
      letter-spacing: .05em; margin-bottom: 14px;
      text-align: left; padding-left: 2px;
    }

    .adm-back-link {
      display: block; margin-top: 20px;
      font-size: 12px; color: var(--text-dim);
      text-decoration: none; letter-spacing: .1em;
      transition: color .2s;
    }
    .adm-back-link:hover { color: var(--text); }

    /* Shake animace při špatném hesle */
    @keyframes adm-shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
    .adm-shake { animation: adm-shake .45s ease; }

    /* ══════════════════════════════════════════════════
       PANEL SHELL
    ══════════════════════════════════════════════════ */
    .adm-shell {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* Topbar */
    .adm-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: rgba(11,9,32,.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      flex-shrink: 0;
    }

    .adm-topbar-left, .adm-topbar-right {
      display: flex; align-items: center; gap: 12px;
    }

    .adm-topbar-logo {
      font-size: 18px;
      animation: spin-slow 10s linear infinite;
    }

    .adm-topbar-title {
      font-family: var(--heading); font-size: 11px;
      font-weight: 700; letter-spacing: .25em;
      color: var(--star); text-transform: uppercase;
    }

    .adm-topbar-sep { color: var(--border-hi); }

    .adm-topbar-sub {
      font-family: var(--mono); font-size: 11px;
      color: var(--text-dim); letter-spacing: .1em;
    }

    .adm-status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }

    /* Záložky */
    .adm-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      flex-shrink: 0;
    }

    .adm-tab {
      padding: 14px 22px 12px;
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-family: var(--heading); font-size: 10px;
      font-weight: 700; letter-spacing: .2em;
      color: var(--text-dim); text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
      transition: color .2s, border-color .2s;
    }
    .adm-tab:hover { color: var(--text); }
    .adm-tab.active {
      color: var(--star);
      border-bottom-color: var(--accent);
    }

    .adm-tab-count {
      background: rgba(123,47,255,.2); border: 1px solid var(--border);
      border-radius: 999px; padding: 1px 8px;
      font-size: 10px; font-family: var(--mono);
      color: var(--glow);
    }

    /* Section */
    .adm-section {
      flex: 1; padding: 20px 24px 32px;
      max-width: 1400px; width: 100%; margin: 0 auto;
    }
    .adm-hidden { display: none !important; }

    /* Toolbar */
    .adm-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }

    .adm-search-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 0 14px;
      transition: border-color .2s;
      flex: 1; max-width: 420px;
    }
    .adm-search-wrap:focus-within { border-color: var(--accent); }

    .adm-search-icon { font-size: 15px; color: var(--text-dim); }

    .adm-search-input {
      background: transparent; border: none; outline: none;
      padding: 10px 0; color: var(--star);
      font-family: var(--body); font-size: 14px;
      width: 100%;
    }
    .adm-search-input::placeholder { color: var(--text-dim); }

    .adm-toolbar-info {
      font-size: 12px; color: var(--text-dim);
      font-family: var(--mono);
    }
    .adm-toolbar-info code {
      color: var(--glow); background: rgba(168,85,247,.1);
      padding: 1px 5px; border-radius: 4px;
    }

    /* ══════════════════════════════════════════════════
       TABULKA HRÁČŮ
    ══════════════════════════════════════════════════ */
    .adm-table-scroll {
      overflow-x: auto; border-radius: 12px;
      border: 1px solid var(--border);
    }

    .adm-table {
      width: 100%; border-collapse: collapse;
      min-width: 780px;
    }

    .adm-table thead {
      background: rgba(123,47,255,.08);
    }

    .adm-table th {
      padding: 12px 16px;
      font-family: var(--heading); font-size: 9px;
      font-weight: 700; letter-spacing: .2em;
      color: var(--glow); text-transform: uppercase;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .adm-table th.adm-tc { text-align: center; }

    .adm-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,.04);
      transition: background .15s;
    }
    .adm-table tbody tr:last-child { border-bottom: none; }
    .adm-table tbody tr:hover { background: rgba(123,47,255,.05); }

    .adm-table td {
      padding: 13px 16px;
      vertical-align: middle;
    }
    .adm-table td.adm-tc { text-align: center; }

    .adm-player-name {
      font-weight: 600; color: var(--star); font-size: 14px;
      display: block;
    }
    .adm-player-uid {
      font-family: var(--mono); font-size: 10px;
      color: var(--text-dim); margin-top: 2px;
      display: block;
    }

    .adm-level-badge {
      display: inline-block;
      background: rgba(123,47,255,.15);
      border: 1px solid rgba(123,47,255,.3);
      border-radius: 999px; padding: 3px 10px;
      font-family: var(--heading); font-size: 10px;
      font-weight: 700; color: var(--glow);
    }

    .adm-sc-val {
      font-family: var(--mono); font-size: 14px;
      font-weight: 700; color: var(--gold);
    }
    .adm-coin-sym { color: var(--gold); opacity: .7; margin-left: 3px; }

    .adm-gem-val {
      font-family: var(--mono); font-size: 14px;
      font-weight: 700; color: var(--gem);
    }
    .adm-gem-sym { margin-left: 2px; }

    /* Akce pro měnu */
    .adm-actions-wrap {
      display: flex; flex-direction: column; gap: 6px;
    }

    .adm-currency-row {
      display: flex; align-items: center; gap: 5px;
    }

    .adm-currency-tag {
      font-family: var(--mono); font-size: 10px;
      font-weight: 700; letter-spacing: .08em;
      padding: 3px 8px; border-radius: 5px;
      min-width: 28px; text-align: center;
    }
    .sc-tag  { background: var(--gold-dim); color: var(--gold); }
    .gem-tag { background: var(--gem-dim);  color: var(--gem); }

    .adm-num-input {
      width: 80px; padding: 6px 8px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 6px; color: var(--star);
      font-family: var(--mono); font-size: 13px;
      outline: none; transition: border-color .2s;
      text-align: right;
    }
    .adm-num-input:focus { border-color: var(--accent); }
    .adm-num-input::-webkit-inner-spin-button { opacity: 1; }

    /* Flash animace */
    @keyframes adm-flash-g {
      0%   { background: rgba(0,229,160,.15); }
      100% { background: transparent; }
    }
    @keyframes adm-flash-r {
      0%   { background: rgba(255,59,110,.12); }
      100% { background: transparent; }
    }
    .adm-flash-green { animation: adm-flash-g .7s ease; }
    .adm-flash-red   { animation: adm-flash-r .7s ease; }

    /* Status řádek pod tabulkou */
    .adm-global-status {
      margin-top: 10px; min-height: 20px;
      font-family: var(--mono); font-size: 12px;
      padding: 8px 14px; border-radius: 8px;
      transition: all .3s;
    }
    .adm-global-status.ok  { color: var(--success); background: rgba(0,229,160,.06); }
    .adm-global-status.err { color: var(--danger);  background: rgba(255,59,110,.06); }

    /* Stavové buňky */
    .adm-loading-cell, .adm-err-cell, .adm-empty-cell {
      padding: 28px; text-align: center;
      font-family: var(--mono); font-size: 13px;
      color: var(--text-dim);
    }
    .adm-err-cell   { color: var(--danger); }
    .adm-empty-cell { color: var(--text-dim); }

    /* ══════════════════════════════════════════════════
       GRID PŘEDMĚTŮ
    ══════════════════════════════════════════════════ */
    .adm-items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .adm-item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .adm-item-card:hover {
      border-color: var(--border-hi);
      box-shadow: 0 0 20px rgba(123,47,255,.08);
    }

    .adm-item-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 16px 10px;
      background: rgba(123,47,255,.05);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .adm-item-name {
      font-family: var(--heading); font-size: 13px;
      font-weight: 700; color: var(--star);
      display: block; margin-bottom: 5px;
    }

    .adm-item-uid {
      font-family: var(--mono); font-size: 10px;
      color: var(--text-dim); white-space: nowrap;
    }

    .adm-badge {
      display: inline-block; border-radius: 4px;
      padding: 2px 7px; font-size: 9px;
      font-family: var(--heading); font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      margin-right: 5px;
    }
    .adm-badge-type   { background: rgba(6,182,212,.15); color: var(--accent2); border: 1px solid rgba(6,182,212,.3); }
    .adm-badge-rarity { border: 1px solid; }
    .adm-rarity-common   { background: rgba(148,163,184,.1); color: #94a3b8; border-color: rgba(148,163,184,.3); }
    .adm-rarity-uncommon { background: rgba(34,197,94,.1);  color: #4ade80; border-color: rgba(34,197,94,.3); }
    .adm-rarity-rare     { background: rgba(59,130,246,.12); color: #60a5fa; border-color: rgba(59,130,246,.35); }
    .adm-rarity-epic     { background: rgba(168,85,247,.12); color: #c084fc; border-color: rgba(168,85,247,.35); }
    .adm-rarity-legendary { background: rgba(251,191,36,.1); color: var(--gold); border-color: rgba(251,191,36,.35); }

    .adm-item-body {
      padding: 14px 16px;
    }

    .adm-item-group-label {
      font-family: var(--heading); font-size: 9px;
      font-weight: 700; letter-spacing: .18em;
      color: var(--text-dim); text-transform: uppercase;
      margin-bottom: 10px;
    }

    .adm-item-fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .adm-item-field {
      display: flex; flex-direction: column; gap: 5px;
    }
    .adm-item-field label {
      font-size: 10px; color: var(--text-dim);
      font-family: var(--mono); letter-spacing: .05em;
    }

    .adm-item-input {
      padding: 8px 10px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 7px; color: var(--star);
      font-family: var(--mono); font-size: 14px;
      outline: none; width: 100%;
      transition: border-color .2s, background .2s;
      text-align: right;
    }
    .adm-item-input:focus {
      border-color: var(--accent);
      background: rgba(123,47,255,.06);
    }

    .adm-item-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,.15);
      gap: 10px;
    }

    .adm-item-status {
      font-family: var(--mono); font-size: 12px;
      flex: 1;
    }
    .adm-item-status.ok  { color: var(--success); }
    .adm-item-status.err { color: var(--danger); }

    /* ══════════════════════════════════════════════════
       TLAČÍTKA
    ══════════════════════════════════════════════════ */
    .adm-btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: var(--heading); font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      text-decoration: none;
      transition: all .18s ease;
      white-space: nowrap;
    }
    .adm-btn:disabled { opacity: .45; cursor: not-allowed; }

    .adm-btn-primary {
      background: linear-gradient(135deg, #7b2fff, #4f0fbb);
      color: white; font-size: 11px; padding: 10px 18px;
      box-shadow: 0 4px 16px rgba(123,47,255,.35);
    }
    .adm-btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(123,47,255,.5);
    }

    .adm-btn-ghost {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      color: var(--text); font-size: 10px; padding: 8px 14px;
    }
    .adm-btn-ghost:hover:not(:disabled) {
      background: rgba(123,47,255,.12);
      border-color: var(--border-hi); color: var(--star);
    }

    .adm-btn-plus {
      background: rgba(0,229,160,.15); border: 1px solid rgba(0,229,160,.35);
      color: var(--success); font-size: 16px; padding: 5px 10px;
      font-family: var(--mono); font-weight: 400; letter-spacing: 0;
      border-radius: 6px;
    }
    .adm-btn-plus:hover { background: rgba(0,229,160,.25); }

    .adm-btn-minus {
      background: rgba(255,59,110,.12); border: 1px solid rgba(255,59,110,.3);
      color: var(--danger); font-size: 16px; padding: 5px 10px;
      font-family: var(--mono); font-weight: 400; letter-spacing: 0;
      border-radius: 6px;
    }
    .adm-btn-minus:hover { background: rgba(255,59,110,.22); }

    .adm-btn-full  { width: 100%; padding: 14px; font-size: 12px; }
    .adm-btn-sm    { font-size: 10px; padding: 8px 14px; }
    .adm-btn-xs    { font-size: 14px; padding: 4px 9px; border-radius: 6px; }

    /* Loading spinner */
    .adm-mini-spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════════════ */
    @media (max-width: 600px) {
      .adm-topbar-title { display: none; }
      .adm-topbar-sep   { display: none; }
      .adm-section      { padding: 16px 12px 32px; }
      .adm-item-fields  { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
      <span class="adm-mini-spinner" style="width:28px;height:28px;border-width:3px;"></span>
    </div>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
